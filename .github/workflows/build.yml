name: build-check

# The image is built on the docker host by Arcane, so CI publishes nothing.
# It exists to fail loudly if the site stops building.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify the docker image builds too
        run: docker build -t eggnet-site:ci .
