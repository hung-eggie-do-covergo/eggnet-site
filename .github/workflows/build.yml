name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'compose.yaml' # the stamp-commit below only touches compose.yaml — don't rebuild on it
  workflow_dispatch:

permissions:
  contents: write # to commit the pinned image tag back
  packages: write # to push to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hung-eggie-do-covergo/eggnet-site:latest
            ghcr.io/hung-eggie-do-covergo/eggnet-site:${{ github.sha }}

      - name: Pin the built image into compose.yaml and commit
        run: |
          sed -i "s|image: ghcr.io/hung-eggie-do-covergo/eggnet-site:.*|image: ghcr.io/hung-eggie-do-covergo/eggnet-site:${{ github.sha }}|" compose.yaml
          git config user.name "eggie"
          git config user.email "eggie@eggnet.dev"
          if ! git diff --quiet compose.yaml; then
            git add compose.yaml
            git commit -m "deploy ${GITHUB_SHA:0:7} [skip ci]"
            git push
          else
            echo "compose already pinned to this sha"
          fi
